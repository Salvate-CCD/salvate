<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: 홈 화면에 추가하면 주소창 없이 앱처럼 열림 (아이콘은 Figma "앱_심볼" 1935:56741) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sálvate" />
    <!-- 상태바는 불투명(default) — 콘텐츠가 상태바 아래에서 시작하므로 웹 화면 여백 계산을 바꾸지 않음 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 홈 화면 앱(standalone)으로 열렸을 때만 viewport-fit=cover — 노치·홈 인디케이터 여백(safe-area)을
         화면이 받아서 위아래를 비움. Safari 브라우저에서는 기존 동작 그대로 (앱 JS 보다 먼저 실행) -->
    <script>
      (function () {
        var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
        if (!standalone) return;
        var meta = document.querySelector('meta[name="viewport"]');
        var content = meta && meta.getAttribute('content');
        if (content && content.indexOf('viewport-fit') === -1) meta.setAttribute('content', content + ', viewport-fit=cover');
      })();
    </script>
    <!-- 서비스 워커: 한 번 받은 아이콘·폰트·JS(해시 붙은 정적 파일)를 폰에 저장 — public/sw.js 참고.
         개발 서버(localhost)에서는 등록하지 않음 -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
